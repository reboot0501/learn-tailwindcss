<!DOCTYPE html>
<html lang='ko'
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color, Border</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <!-- p tag 클래스
      background-color : bg-blue-500 
      text-color : text-white
      font-size : text-3xl
      padding : p-4
      margin-bottom : mb-6
    -->
    <p class="bg-blue-500 text-white text-3xl p-4 mb-6">
      배경이 파란색, 글자색 흰색, 폰트 사이즈 크게
    </p>
    <!-- p tag 클래스
    border-width : border-2
      border-color : border-blue-600
      border-radius : rounded-full
      padding : p-4
    -->
    <p class="border-2 border-blue-600 rounded-full p-4">
      파란색 보더와 둥근 모서리를 가진 보더를 적용! 
    </p>
</body>
</html>
