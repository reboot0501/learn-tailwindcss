<!DOCTYPE html>
<html lang='ko'
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Position - Fixed</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
  <header class="fixed left-0 right-0 bg-gray-800 p-4 text-white rounded-lg z-50">
    <nav class="flex justify-start items-center gap-6">
      <div class="text-2xl font-bold">My Shop</div>
      <div class="flex flex-1 gap-4 items-center">
        <ul class="flex gap-4">
          <li><a href="#" class="font-bold text-gray-500 hover:text-white">Home</a></li>
          <li><a href="#" class="font-bold text-gray-500 hover:text-white">About</a></li>
          <li><a href="#" class="font-bold text-gray-500 hover:text-white">Services</a></li>
          <li><a href="#" class="font-bold text-gray-500 hover:text-white">Contact</a></li>
        </ul>
        <button
          class="ml-auto bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-700"
        >
          Login
        </button>
      </div>
    </nav>
  </header>
  <!-- main
    1. container: 요소의 너비를 현재 브레이크포인트에 고정하는 컴포넌트입니다.
    |  Class    |  Breakpoint   |   Properties         |
    | container |	 None	        | width: 100%;         |
                |  sm (640px)   |	max-width: 640px;    |
                |  md (768px)   | max-width: 768px;    |
                |  lg (1024px)  | max-width: 1024px;   |
                |  xl (1280px)  | max-width: 1280px;   |
                |  2xl (1536px) | max-width: 1536px;   |

  -->
  <main class="container max-w-2xl mx-auto px-4 pb-8 pt-20">
    <div class="grid grid-cols-2 gap-2">
        <img
          src="https://dummyimage.com/400x400/cccccc/000000&text=City"
          alt="City Image"
          class="w-full h-full rounded-lg shadow-md"
        />
        <img
          src="https://dummyimage.com/400x400/cccccc/000000&text=Landscape"
          alt="Landscape Image"
          class="w-full h-full rounded-lg shadow-md"
        />
        <img
          src="https://dummyimage.com/400x400/cccccc/000000&text=Mountain"
          alt="Mountain Image"
          class="w-full h-full rounded-lg shadow-md"
        />
        <img
          src="https://dummyimage.com/400x400/cccccc/000000&text=River"
          alt="River Image"
          class="w-full h-full rounded-lg shadow-md"
        />
        <img
          src="https://dummyimage.com/400x400/cccccc/000000&text=Forest"
          alt="Forest Image"
          class="w-full h-full rounded-lg shadow-md"
        />
        <img
          src="https://dummyimage.com/400x400/cccccc/000000&text=Ocean"
          alt="Ocean Image"
          class="w-full h-full rounded-lg shadow-md"
        />
        <img
          src="https://dummyimage.com/400x400/cccccc/000000&text=Desert"
          alt="Desert Image"
          class="w-full h-full rounded-lg shadow-md"
        />
        <img
          src="https://dummyimage.com/400x400/cccccc/000000&text=Waterfall"
          alt="Waterfall Image"
          class="w-full h-full rounded-lg shadow-md"
        />
        <img
          src="https://dummyimage.com/400x400/cccccc/000000&text=Beach"
          alt="Beach Image"
          class="w-full h-full rounded-lg shadow-md"
        />
    </div>
  </main>  
</body>
</html>
