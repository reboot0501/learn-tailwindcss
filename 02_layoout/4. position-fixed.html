<!DOCTYPE html>
<html lang='ko'
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Position - Fixed</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
  <!-- header 영역 브라우저 고정
    1. fixed : 브라우저 창을 스크롤해도 header 영역이 고정되어 표시됩니다. 
    2. w-full : 너비를 부모 요소의 100%로 설정합니다. (width: 100%;)
    3. bg-gray-300 : 배경색을 회색으로 설정합니다. (background-color: rgb(209 213 219);)
    4. p-6 : 요소의 상하좌우 여백을 설정합니다. (padding-top, padding-bottom, padding-left, padding-right: 1.5rem;)
    5. flex : flexbox 레이아웃을 사용하기 위한 속성
    6. gap-6 : 자식 요소들 사이의 간격을 6px로 설정합니다. (gap: 1.5rem; 24px)
    7. items-center : 자식 요소들을 수직 Y 축 중앙 정렬
    8. z-50 : 다른 요소보다 상대적으로 상위 레이어에 고정
  -->
  <header class="fixed w-full bg-gray-300 p-6 flex gap-6 items-center z-50">
    <div class="text-3xl font-black text-white">My Shop</div>
    <div class="flex-1 flex gap-6 justify-between items-center">
      <nav>
        <ul>
          <li>
            <a href="" class="text-gray-500 font-bold hover:text-gray-950">Home</a>
            <a href="" class="text-gray-500 font-bold hover:text-gray-950">About</a>
            <a href="" class="text-gray-500 font-bold hover:text-gray-950">Services</a>
            <a href="" class="text-gray-500 font-bold hover:text-gray-950">Contact</a>
          </li>
        </ul>
      </nav>
      <button class="text-white bg-blue-500 hover:bg-blue-700 rounded-sm px-2 py-4"
      >로그인
      </button>
    </div>
  </header>

  <main class="container max-w-2xl mx-auto px-4 pb-8 pt-20">
    <div class="grid grid-cols-2 gap-2">
        <img
          src="https://dummyimage.com/400x400/cccccc/000000&text=City"
          alt="City Image"
          class="w-full h-full rounded-lg shadow-md"
        />
        <img
          src="https://dummyimage.com/400x400/cccccc/000000&text=Landscape"
          alt="Landscape Image"
          class="w-full h-full rounded-lg shadow-md"
        />
        <img
          src="https://dummyimage.com/400x400/cccccc/000000&text=Mountain"
          alt="Mountain Image"
          class="w-full h-full rounded-lg shadow-md"
        />
        <img
          src="https://dummyimage.com/400x400/cccccc/000000&text=River"
          alt="River Image"
          class="w-full h-full rounded-lg shadow-md"
        />
        <img
          src="https://dummyimage.com/400x400/cccccc/000000&text=Forest"
          alt="Forest Image"
          class="w-full h-full rounded-lg shadow-md"
        />
        <img
          src="https://dummyimage.com/400x400/cccccc/000000&text=Ocean"
          alt="Ocean Image"
          class="w-full h-full rounded-lg shadow-md"
        />
        <img
          src="https://dummyimage.com/400x400/cccccc/000000&text=Desert"
          alt="Desert Image"
          class="w-full h-full rounded-lg shadow-md"
        />
        <img
          src="https://dummyimage.com/400x400/cccccc/000000&text=Waterfall"
          alt="Waterfall Image"
          class="w-full h-full rounded-lg shadow-md"
        />
        <img
          src="https://dummyimage.com/400x400/cccccc/000000&text=Beach"
          alt="Beach Image"
          class="w-full h-full rounded-lg shadow-md"
        />
        <img
          src="https://dummyimage.com/400x400/cccccc/000000&text=Face"
          alt="Face Image"
          class="w-full h-full rounded-lg shadow-md"
        />
    </div>
  </main>  
</body>
</html>
