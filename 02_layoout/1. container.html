<!DOCTYPE html>
<html lang='ko'
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Container</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <!--
      1. container: 웹 레이아웃의 주요 콘텐츠를 담는 요소.
      2. max-w-5xl: 최대 너비를 5xl (64rem, 1024px)로 설정.
      3. p-4: 내부 여백을 (1rem, 16px) 설정.
      4. bg-indigo-600: 배경색을 인디고 색상으로 설정.
      5. text-white: 글자색을 흰색으로 설정.
      6. h-screen: 높이를 화면 전체로 설정.
      7. mx-auto: 수평 중앙 정렬을 위해 사용됩니다. (margin-left: auto; margin-right: auto;)
    -->
    <main class="container max-w-5xl p-4 bg-indigo-600 text-white h-screen mx-auto">
      Lorem ipsum dolor sit amet consectetur adipisicing elit. 
      Repellendus exercitationem voluptas similique sit qui est nostrum doloribus, totam magni, fuga reiciendis officia in adipisci veniam. 
      Soluta nihil libero earum enim!
    </main>
</body>
</html>
