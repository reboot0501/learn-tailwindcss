<!DOCTYPE html>
<html lang='ko'
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
  <header class="bg-gray-200 mt-6 p-6 rounded-lg mb-6">
    <nav class="flex justify-start items-center gap-6">
      <div class="text-2xl font-bold">로고</div>
      <div class="flex flex-1 gap-4 items-center">
        <ul class="flex gap-4">
          <li><a href="#" class="text-gray-500 hover:text-gray-900">Home</a></li>
          <li><a href="#" class="text-gray-500 hover:text-gray-900">About</a></li>
          <li><a href="#" class="text-gray-500 hover:text-gray-900">Services</a></li>
          <li><a href="#" class="text-gray-500 hover:text-gray-900">Contact</a></li>
        </ul>
        <button
          class="ml-auto bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-700"
        >
          Login
        </button>
      </div>
    </nav>
  </header>
  <main class="container max-w-lg p-4">
    <div class="grid grid-cols-3 gap-2">
        <img
          src="https://dummyimage.com/400x400/cccccc/000000&text=City"
          alt="City Image"
          class="w-full h-full rounded-lg shadow-md"
        />
        <img
          src="https://dummyimage.com/400x400/cccccc/000000&text=Landscape"
          alt="Landscape Image"
          class="w-full h-full rounded-lg shadow-md"
        />
        <img
          src="https://dummyimage.com/400x400/cccccc/000000&text=Mountain"
          alt="Mountain Image"
          class="w-full h-full rounded-lg shadow-md"
        />
        <img
          src="https://dummyimage.com/400x400/cccccc/000000&text=River"
          alt="River Image"
          class="w-full h-full rounded-lg shadow-md"
        />
        <img
          src="https://dummyimage.com/400x400/cccccc/000000&text=Forest"
          alt="Forest Image"
          class="w-full h-full rounded-lg shadow-md"
        />
        <img
          src="https://dummyimage.com/400x400/cccccc/000000&text=Ocean"
          alt="Ocean Image"
          class="w-full h-full rounded-lg shadow-md"
        />
        <img
          src="https://dummyimage.com/400x400/cccccc/000000&text=Desert"
          alt="Desert Image"
          class="w-full h-full rounded-lg shadow-md"
        />
        <img
          src="https://dummyimage.com/400x400/cccccc/000000&text=Waterfall"
          alt="Waterfall Image"
          class="w-full h-full rounded-lg shadow-md"
        />
        <img
          src="https://dummyimage.com/400x400/cccccc/000000&text=Beach"
          alt="Beach Image"
          class="w-full h-full rounded-lg shadow-md"
        />
    </div>
  </main>
</body>
</html>
