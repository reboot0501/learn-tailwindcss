<!DOCTYPE html>
<html lang='ko'
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Practice</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
  <header class="bg-gray-200 flex gap-6 p-6 rounded-lg items-center">
    <div class="text-3xl text-black">로고</div>
    <div class="flex-1 flex gap-6 items-center justify-between">
      <nav>
        <ul class="flex gap-6">
          <li><a href="" class="text-gray-400 font-black hover:text-gray-950">Home</a></li>
          <li><a href="" class="text-gray-400 font-black hover:text-gray-950">About</a></li>
          <li><a href="" class="text-gray-400 font-black hover:text-gray-950">Services</a></li>
          <li><a href="" class="text-gray-400 font-black hover:text-gray-950">Contact</a></li>
        </ul>
      </nav>
      <button class="bg-blue-500 text-white font-black px-2 py-3 rounded-sm hover:bg-blue-950">
        로그인
      </button>
    </div>
  </header>

  <main class="container mx-auto p-4">
    <div class="grid grid-cols-3 gap-2">
      <img 
          src="https://dummyimage.com/400x400/cccccc/000000&text=City"
          alt="City Image"
          class="w-full h-full rounded-lg shadow-md"
      />
      <img
          src="https://dummyimage.com/400x400/cccccc/000000&text=Landscape"
          alt="Landscape Image"
          class="w-full h-full rounded-lg shadow-md"
      />
      <img
          src="https://dummyimage.com/400x400/cccccc/000000&text=Mountain"
          alt="Mountain Image"
          class="w-full h-full rounded-lg shadow-md"
      />
      <img
        src="https://dummyimage.com/400x400/cccccc/000000&text=River"
        alt="River Image"
        class="w-full h-full rounded-lg shadow-md"
      />
      <img
        src="https://dummyimage.com/400x400/cccccc/000000&text=Forest"
        alt="Forest Image"
        class="w-full h-full rounded-lg shadow-md"
      />
      <img
        src="https://dummyimage.com/400x400/cccccc/000000&text=Ocean"
        alt="Ocean Image"
        class="w-full h-full rounded-lg shadow-md"
      />
      <img
        src="https://dummyimage.com/400x400/cccccc/000000&text=Desert"
        alt="Desert Image"
        class="w-full h-full rounded-lg shadow-md"
      />
      <img
        src="https://dummyimage.com/400x400/cccccc/000000&text=Waterfall"
        alt="Waterfall Image"
        class="w-full h-full rounded-lg shadow-md"
      />
      <img
        src="https://dummyimage.com/400x400/cccccc/000000&text=Beach"
        alt="Beach Image"
        class="w-full h-full rounded-lg shadow-md"
      />
      <img
        src="https://dummyimage.com/400x400/cccccc/000000&text=Face"
        alt="Face Image"
        class="w-full h-full rounded-lg shadow-md"
      />
    </div>
  </main>
</body>
</html>
