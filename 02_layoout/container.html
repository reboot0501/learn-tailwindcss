<!DOCTYPE html>
<html lang='ko'
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Container</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <!--
      1. container: Tailwind CSS에서 제공하는 컨테이너 클래스로, 콘텐츠를 중앙에 정렬하고 최대 너비를 설정합니다.
      2. max-w-2xl: 최대 너비를 설정합니다. 여기서는 2xl (42rem, 672px)로 설정되어 있습니다.
      3. p-4: 내부 여백을 설정합니다. (padding: 1rem;)
      4. bg-indigo-600: 배경색을 인디고 색상으로 설정합니다.
      5. text-white: 글자색을 흰색으로 설정합니다.
      6. h-screen: 높이를 화면 전체로 설정합니다.
      7. mx-auto: 수평 중앙 정렬을 위해 사용됩니다. (margin-left: auto; margin-right: auto;)
    -->
    <main class="container max-w-2xl p-4 bg-indigo-600 text-white h-screen mx-auto">
      Lorem ipsum dolor sit amet consectetur adipisicing elit. 
      Repellendus exercitationem voluptas similique sit qui est nostrum doloribus, totam magni, fuga reiciendis officia in adipisci veniam. 
      Soluta nihil libero earum enim!
    </main>
</body>
</html>
