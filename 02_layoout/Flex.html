<!DOCTYPE html>
<html lang='ko'
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <!-- GNB 헤더 메뉴 링크 중앙정렬
      1. header: 헤더 영역을 나타내는 시맨틱 태그입니다.
        -. bg-gray-200: 배경색을 회색으로 설정합니다.
        -. mt-6: 상단 여백을 설정합니다. (margin-top: 1.5rem;)
        -. p-6: 내부 여백을 설정합니다. (padding: 1.5rem;)
        -. rounded-lg: 모서리를 둥글게 설정합니다. (border-radius: 0.5rem;)
      2. nav: 내비게이션 영역을 나타내는 시맨틱 태그입니다.
        -. flex: Flexbox 레이아웃을 적용합니다.
        -. justify-between: 자식 요소들을 좌우로 분리하여 배치합니다.
        -. items-center: 자식 요소들을 수직 중앙 정렬합니다.
      3. 로고 영역
        -. text-2xl: 글자 크기를 2xl로 설정합니다. (font-size: 1.5rem;)
        -. font-bold: 글자 두께를 굵게 설정합니다. (font-weight: 700;)
      4. 네비게이션 링크 영역 ( 중앙정렬 )
        -. ul: 순서 없는 리스트를 나타내는 태그입니다.
        -. flex: Flexbox 레이아웃을 적용합니다.
        -. gap-4: 자식 요소들 사이에 간격을 설정합니다. (gap: 1rem;)
        -. li: 리스트 항목을 나타내는 태그입니다.
          -. a: 하이퍼링크를 나타내는 태그입니다.
            - text-gray-500: 글자색을 회색으로 설정합니다.
            - hover:text-gray-900: 마우스 오버 시 글자색을 진한 회색으로 변경합니다.  
      5. 로그인 버튼 영역
        -. button: 버튼을 나타내는 태그입니다.
        -. bg-blue-500: 배경색을 파란색으로 설정합니다.
        -. text-white: 글자색을 흰색으로 설정합니다.
        -. py-2: 상하 여백을 설정합니다. (padding-top, padding-bottom: 0.5rem;)
        -. px-4: 좌우 여백을 설정합니다. (padding-left, padding-right: 1rem;)
        -. rounded: 모서리를 둥글게 설정합니다. (border-radius: 0.25rem;)
        -. hover:bg-blue-700: 마우스 오버 시 배경색을 진한 파란색으로 변경합니다. 
    -->
    <header class="bg-gray-200 mt-6 p-6 rounded-lg mb-6">
      <nav class="flex justify-between items-center">
        <!-- 좌측: 로고 -->
        <div class="text-2xl font-bold">MyWebsite</div>
        <!-- 중앙: 네비게이션 링크 -->
        <ul class="flex gap-4">
          <li>
            <a href="#" class="text-gray-500 hover:text-gray-900">Home</a>
          </li>
          <li>
            <a href="#" class="text-gray-500 hover:text-gray-900">About</a>
          </li>
          <li>
            <a href="#" class="text-gray-500 hover:text-gray-900">Services</a>
          </li>
          <li>
            <a href="#" class="text-gray-500 hover:text-gray-900">Contact</a>
          </li>
        </ul>
        <!-- 우측: 로그인 버튼 -->
        <div>
          <button
            class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-700"
          >
            Login
          </button>
        </div>
      </nav>
      </nav>
    </header>
    
    <!--GNB 헤더 메뉴 우측
      1. header: 헤더 영역을 나타내는 시맨틱 태그입니다.
        -. bg-gray-200: 배경색을 회색으로 설정합니다.
        -. mt-6: 상단 여백을 설정합니다. (margin-top: 1.5rem;)
        -. p-6: 내부 여백을 설정합니다. (padding: 1.5rem;)
        -. rounded-lg: 모서리를 둥글게 설정합니다. (border-radius: 0.5rem;)
      2. nav: 내비게이션 영역을 나타내는 시맨틱 태그입니다.
        -. flex: Flexbox 레이아웃을 적용합니다.
        -. justify-between: 자식 요소들을 좌우로 분리하여 배치합니다.
        -. items-center: 자식 요소들을 수직 중앙 정렬합니다.
      3. 로고 영역
        -. text-2xl: 글자 크기를 2xl로 설정합니다. (font-size: 1.5rem;)
        -. font-bold: 글자 두께를 굵게 설정합니다. (font-weight: 700;)
      4. ★★★ 네비게이션 링크 & 로그인 버튼 영역 (로고는 좌측, 하나의 묶음 단위로 맨 우측으로 보냄) ★★★
        -. div: Flexbox 레이아웃을 적용하여 자식 요소들을 가로로 배치합니다.
          -. ul: 메뉴 링크 영역, 순서 없는 리스트를 나타내는 태그입니다.
            -. flex: Flexbox 레이아웃을 적용합니다.
            -. gap-4: 자식 요소들 사이에 간격을 설정합니다. (gap: 1rem;)
            -. li: 리스트 항목을 나타내는 태그입니다.
              -. a: 하이퍼링크를 나타내는 태그입니다.
                - text-gray-500: 글자색을 회색으로 설정합니다.
                - hover:text-gray-900: 마우스 오버 시 글자색을 진한 회색으로 변경합니다.  
            -. button: 로그인 버튼 영역, 버튼을 나타내는 시맨틱 태그입니다.
              -. bg-blue-500: 배경색을 파란색으로 설정합니다.
              -. text-white: 글자색을 흰색으로 설정합니다.
              -. py-2: 상하 여백을 설정합니다. (padding-top, padding-bottom: 0.5rem;)
              -. px-4: 좌우 여백을 설정합니다. (padding-left, padding-right: 1rem;)
              -. rounded: 모서리를 둥글게 설정합니다. (border-radius: 0.25rem;)
              -. hover:bg-blue-700: 마우스 오버 시 배경색을 진한 파란색으로 변경합니다.
    -->
    <header class="bg-gray-200 mt-6 p-6 rounded-lg mb-6">
      <nav class="flex justify-between items-center">
        <div class="text-2xl font-bold">로고</div>
        <div class="flex gap-4 items-center">
          <ul class="flex gap-4">
            <li><a href="#" class="text-gray-500 hover:text-gray-900">Home</a></li>
            <li><a href="#" class="text-gray-500 hover:text-gray-900">About</a></li>
            <li><a href="#" class="text-gray-500 hover:text-gray-900">Services</a></li>
            <li><a href="#" class="text-gray-500 hover:text-gray-900">Contact</a></li>
          </ul>
          <button
            class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-700"
          >
            Login
          </button>
        </div>
      </nav>
    </header>
    
<!--GNB 헤더 메뉴 좌측, Login 버튼 우측정렬
      1. header: 헤더 영역을 나타내는 시맨틱 태그입니다.
        -. bg-gray-200: 배경색을 회색으로 설정합니다.
        -. mt-6: 상단 여백을 설정합니다. (margin-top: 1.5rem;)
        -. p-6: 내부 여백을 설정합니다. (padding: 1.5rem;)
        -. rounded-lg: 모서리를 둥글게 설정합니다. (border-radius: 0.5rem;)
      2. nav: 내비게이션 영역을 나타내는 시맨틱 태그입니다.
        -. flex: Flexbox 레이아웃을 적용합니다.
        -. justify-start: 자식 요소들을 좌측으로 정렬합니다.
        -. items-center: 자식 요소들을 수직 중앙 정렬합니다.
        -. gap-6: 자식 요소들 사이에 간격을 설정합니다. (gap: 1.5rem;)
      3. 로고 영역
        -. text-2xl: 글자 크기를 2xl로 설정합니다. (font-size: 1.5rem;)
        -. font-bold: 글자 두께를 굵게 설정합니다. (font-weight: 700;)
      4. 네비게이션 링크 & 로그인 버튼 영역 ( 좌측정렬 )
        -. div: Flexbox 레이아웃을 적용하여 자식 요소들을 가로로 배치합니다.
          ★★★ flex-1: 남은 공간을 모두 차지하도록 설정합니다. (flex-grow: 1;) ★★★
          -. gap-4: 자식 요소들 사이에 간격을 설정합니다. (gap: 1rem;)
          -. items-center: 자식 요소들을 수직 중앙 정렬합니다.
          -. ul: 메뉴 링크 영역, 순서 없는 리스트를 나타내는 태그입니다.
            -. flex: Flexbox 레이아웃을 적용합니다.
            -. gap-4: 자식 요소들 사이에 간격을 설정합니다. (gap: 1rem;)
            -. li: 리스트 항목을 나타내는 태그입니다.
              -. a: 하이퍼링크를 나타내는 태그입니다.
                - text-gray-500: 글자색을 회색으로 설정합니다.
                - hover:text-gray-900: 마우스 오버 시 글자색을 진한 회색으로 변경합니다.  
            -. button: 로그인 버튼 영역, 버튼을 나타내는 시맨틱 태그입니다.
              ★★★ ml-auto: 좌측 여백을 자동으로 설정하여 우측 정렬합니다. (margin-left: auto;) ★★★
              -. bg-blue-500: 배경색을 파란색으로 설정합니다.
              -. text-white: 글자색을 흰색으로 설정합니다.
              -. py-2: 상하 여백을 설정합니다. (padding-top, padding-bottom: 0.5rem;)
              -. px-4: 좌우 여백을 설정합니다. (padding-left, padding-right: 1rem;)
              -. rounded: 모서리를 둥글게 설정합니다. (border-radius: 0.25rem;)
              -. hover:bg-blue-700: 마우스 오버 시 배경색을 진한 파란색으로 변경합니다.
    -->
    <header class="bg-gray-200 mt-6 p-6 rounded-lg mb-6">
      <nav class="flex justify-start items-center gap-6">
        <div class="text-2xl font-bold">로고</div>
        <div class="flex flex-1 gap-4 items-center">
          <ul class="flex gap-4">
            <li><a href="#" class="text-gray-500 hover:text-gray-900">Home</a></li>
            <li><a href="#" class="text-gray-500 hover:text-gray-900">About</a></li>
            <li><a href="#" class="text-gray-500 hover:text-gray-900">Services</a></li>
            <li><a href="#" class="text-gray-500 hover:text-gray-900">Contact</a></li>
          </ul>
          <button
            class="ml-auto bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-700"
          >
            Login
          </button>
        </div>
      </nav>
    </header>
</body>
</html>
