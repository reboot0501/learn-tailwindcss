<!DOCTYPE html>
<html lang='ko'
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>레이아웃-연습</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<!-- body tag class
  화면 전체 높이(100vh)를 차지하고 자식들(<header>, <page>)을 위아래로 배치합니다.
-->
<body class="h-screen flex flex-col">
  <!-- header 태그 class
    1. flex : 자식 요소들을 가로로 배치
    2. gap-6 : 자식 요소들 사이 간격 6
    3. bg-gray-500 : 배경색 회색
    4. px-4 py-6 : 패딩 4, 6
    5. items-center : 자식 요소들을 수직으로 가운데 정렬
    6. h-20 : 높이 20
    7. shrink-0 : 자식 요소들이 줄어들지 않도록 방지
  -->
  <header class="flex gap-6 bg-gray-500 px-4 py-6 items-center h-20 shrink-0">
    <div class="w-1/5 text-3xl font-black text-white">로고</div>
    <div class="w-4/5 flex gap-6 justify-between items-center">
      <nav>
        <ul class="flex gap-6">
          <li><a href="" class="text-white hover:text-gray-950 hover:font-bold">Home</a></li>
          <li><a href="" class="text-white hover:text-gray-950 hover:font-bold">About</a></li>
          <li><a href="" class="text-white hover:text-gray-950 hover:font-bold">Services</a></li>
          <li><a href="" class="text-white hover:text-gray-950 hover:font-bold">Contact</a></li>
        </ul>
      </nav>
      <div class="px-4 py-5 bg-blue-500 text-white hover:bg-blue-950 rounded-lg">로그인</div>
    </div>
  </header>
  <!-- page tag class
    1. flex-1 : <header> 높이를 제외한 나머지 브라우저 하단 공간 전체를 자동으로 차지
    2. min-h-0 : 자식 요소(aside, main)가 부모보다 클 때 스크롤이 생기는 것을 방지합니다.
      - Flex 아이템은 기본적으로 내용물 크기(min-height: auto)를 유지하려 하기 때문에, 
        메뉴가 많아지면 브라우저 하단을 뚫고 내려갈 수 있습니다. 
      - min-h-0을 주어야 부모 영역 높이를 넘지 않고 자식 <aside>의 overflow-y-auto 스크롤이 정상 작동합니다.
    3. flex : <aside><main>를 좌우로 배치
    4. gap-6 : <aside>와 <main> 사이 간격 6
  -->
  <page class="flex-1 min-h-0 flex gap-1">
    <!-- LNB  aside tag class
      1. w-1/5 : 전체 너비의 1/5 차지
      2. bg-gray-200 : 배경색 회색
      3. p-4 : 패딩 4
      4. overflow-y-auto : 세로 스크롤
    -->
    <aside class="w-1/5 bg-gray-200 p-4 overflow-y-scroll">
      <nav>
        <!-- nav tag class
          1. py-6 : 패딩 6
          2. flex : flex-col로 자식 ul을 세로로 배치
          3. gap-6 : 자식 ul 사이 간격 6
        -->
        <ul class="py-6 flex flex-col gap-6">
          <li>
            <!-- a tag class 
              1. block : 
                - 기본적으로 a tag 는 글자 크기만큼만 차지하는 inline 요소
                - block 으로 한 줄 전체(가로 100%)를 차지하게 되어, 텍스트뿐만 아니라 해당 줄의 빈 공간을 클릭해도 링크가 눌림
              2. px-3 py-2 : 패딩 3, 2
              3. rounded : 둥근 모서리
              4. hover:bg-gray-500 : 마우스를 올리면 배경색 회색
            -->
            <a href="" 
              class="block px-3 py-2 rounded hover:bg-gray-500"
            >메뉴 A</a>
          </li>
          <li>
            <a href="" 
              class="block px-3 py-2 rounded hover:bg-gray-500" 
            >메뉴 B</a>
          </li>
          <li>
            <a href=""
              class="block px-3 py-2 rounded hover:bg-gray-500"
            >메뉴 C</a>
          </li>
        </ul>
      </nav>
    </aside>
    <!-- main tag class
      1. w-4/5 : 전체 너비의 4/5 차지
      2. bg-gray-50 : 배경색 회색
      3. px-6 py-6 : 패딩 6
      4. flex flex-col : flex로 자식 section을 세로로 배치
      5. gap-6 : 자식 section 사이 간격 6
    -->
    <main class="w-4/5 bg-gray-50 px-6 py-6 flex flex-col gap-6">
      <!-- 화면 제목 section tag class
        1. shrink-0 : flex 컨테이너에서 높이가 줄어들지 않도록 고정 (height: auto 대신)
        2. p-4 : 패딩 4
        3. border-b : 아래 border 
      -->
      <section class="shrink-0 p-4 border-b">
        <h1 class="text-2xl font-semibold">화면 제목</h1>
      </section>
      <!-- 검색조건 form tag class 
        1. shrink-0 : flex 컨테이너에서 높이가 줄어들지 않도록 고정 (height: auto 대신)
        2. p-4 : 패딩 4
      -->
      <section class="shrink-0 p-4">
        <!-- h2 tag class
          1. mb-3 : 아래 margin 3
          2. text-base : 글자 크기 기본
          3. font-semibold : 글자 두께 중간 
        -->
        <h2 class="mb-3 text-base font-semibold">검색조건</h2>
        <!-- grid tag class 
          1. grid : grid 사용
          2. grid-cols-3 : 컬럼 3개
          3. gap-4 : 자식 요소 사이 간격 4
          4. items-center : 자식 요소들을 수직으로 가운데 정렬
        -->
        <div class="grid grid-cols-3 gap-4 items-center">
          <!-- 1행 -->
          <div>
            <input type="text" 
                   placeholder="검색어 입력" 
                   class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            >
          </div>
          <div>
            <select id="category" name="category" aria-label="카테고리" 
                    class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            >
              <option value="">카테고리 선택</option>
              <option value="category1">카테고리 1</option>
              <option value="category2">카테고리 2</option>
              <option value="category3">카테고리 3</option>
            </select>
          </div>
          <div>
            <select id="status" name="status" aria-label="상태" 
                    class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            >
              <option value="">상태 전체</option>
              <option value="active">정상</option>
              <option value="inactive">대기</option>
            </select>
          </div>
          <!-- 2행 -->
          <div>
            <input type="date" aria-label="시작일" 
                   class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            >
          </div>
          <div>
            <input type="date" aria-label="종료일" 
                   class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            >
          </div>
          <div>
            <input type="text" 
                   placeholder="작성자 입력" 
                   class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            >
          </div>
          <!-- 3행 -->
          <div>
            <select id="sort" name="sort" aria-label="정렬 방식" 
                    class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            >
              <option value="latest">최신순</option>
              <option value="oldest">오래된순</option>
            </select>
          </div>
          <div>
            <select id="limit" name="limit" aria-label="노출 개수" 
                    class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            >
              <option value="10">10개씩 보기</option>
              <option value="20">20개씩 보기</option>
              <option value="50">50개씩 보기</option>
            </select>
          </div>
          <!-- 3행 3열: 검색 버튼 우측 정렬 -->
          <div class="flex justify-end">
            <button class="bg-blue-500 text-white px-6 py-2 rounded-lg cursor-pointer hover:bg-blue-600 transition-colors">검색</button>
          </div>
        </div>
      </section>
      <!-- 검색결과 table 영역
        1. flex-1 : flex-grow 1로, 부모 영역 높이를 제외한 나머지 브라우저 하단 공간 전체를 자동으로 차지
        2. min-h-0 : 자식 요소(table)가 부모보다 클 때 스크롤이 생기는 것을 방지
        3. p-4 : 패딩 4
        4. flex flex-col : flex로 자식 table을 세로로 배치
        5. gap-6 : 자식 table 사이 간격 6
      -->
      <section class="flex-1 min-h-0 p-4 flex flex-col">
        <!-- h2 tag class
          1. shrink-0 : flex 컨테이너에서 높이가 줄어들지 않도록 고정 (height: auto 대신)
          2. mb-3 : 아래 margin 3
          3. text-base : 글자 크기 기본
          4. font-semibold : 글자 두께 중간 
        -->
        <h2 class="shrink-0 mb-3 text-base font-semibold">검색결과</h2>
        <!-- Table 영역 div tag class
            1. flex-1 : flex-grow 1로, 부모 영역 높이를 제외한 나머지 브라우저 하단 공간 전체를 자동으로 차지
            2. min-h-0 : 자식 요소(table)가 부모보다 클 때 스크롤이 생기는 것을 방지
            3. overflow-y-scroll : 세로 스크롤
            4. rounded-md : 둥근 모서리 
            5. bg-white : 흰색 배경
        -->
        <div class="flex-1 min-h-0 overflow-y-scroll rounded-md bg-white">
          <!-- table tag class 
            1. w-full : 전체 너비 100%
            2. table-fixed : 테이블 컬럼 너비를 고정
            3. border-collapse : border 합치기 
            4. text-sm : 글자 크기 작음
          -->
          <table class="w-full table-fixed border-collapse text-sm">
            <!-- colgroup tag class -->
            <colgroup>
              <col class="w-1/5">
              <col class="w-3/5">
              <col class="w-1/5">
            </colgroup>
            <!-- thead tag class
              1. sticky top-0 : 스크롤 시 상단에 고정
              2. z-10 : z-index 10
              3. bg-gray-100 : 배경색 회색
            -->
            <thead class="sticky top-0 z-10 bg-gray-100">
              <tr>
                <th class="w-1/5 border-b border-gray-200 px-4 py-3 text-center">번호</th>
                <th class="w-3/5 border-b border-gray-200 px-4 py-3 text-center">이름</th>
                <th class="w-1/5 border-b border-gray-200 px-4 py-3 text-center">상태</th>
              </tr>
            </thead>
            <!-- Table Body -->
            <tbody>
              <tr>
                <td class="border-b border-gray-200 px-4 py-3 text-center">1</td>
                <td class="border-b border-gray-200 px-4 py-3 text-left">데이터 1</td>
                <td class="border-b border-gray-200 px-4 py-3 text-center">정상</td></tr>
              <tr>
                <td class="border-b border-gray-200 px-4 py-3 text-center">2</td>
                <td class="border-b border-gray-200 px-4 py-3 text-left">데이터 2</td>
                <td class="border-b border-gray-200 px-4 py-3 text-center">정상</td></tr>
              <tr>
                <td class="border-b border-gray-200 px-4 py-3 text-center">3</td>
                <td class="border-b border-gray-200 px-4 py-3 text-left">데이터 3</td>
                <td class="border-b border-gray-200 px-4 py-3 text-center">정상</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </page>
</body>
</html>
